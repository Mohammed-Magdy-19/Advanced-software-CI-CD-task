<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A searchable directory of sample records.">
    <title>CI/CD Task</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main>
      <section class="directory-card" aria-labelledby="page-title">
        <header>
          <p class="eyebrow">CI/CD Task</p>
          <h1 id="page-title">Team Members</h1>
          <p class="intro">Browse the sample records or search by name.</p>
        </header>
        <div class="table-section">
          <label for="name-search">Search by name</label>
          <input
            id="name-search"
            type="search"
            placeholder="e.g. Alex Morgan"
            autocomplete="off"
          >
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Name</th>
                  <th scope="col">ID</th>
                </tr>
              </thead>
              <tbody id="people-list">
                <tr><td>Mohammed Magdy Mohammed</td><td>20240524</td></tr>
                <tr><td>Mahmoud Khaled Anwar Lethy</td><td>20240550</td></tr>
                <tr><td>Adham Mohamed Megahed</td><td>20240072</td></tr>
                <tr><td>Arwa Atef Ahmed </td><td>20240808</td></tr>
              </tbody>
            </table>
            <p id="empty-state" role="status">No matching names found.</p>
          </div>
        </div>
      </section>
    </main>
    <script src="assets/js/script.js" defer></script>
  </body>
</html>
